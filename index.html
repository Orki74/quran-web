<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Web - Kuran-ı Kerim</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📖 Kuran-ı Kerim</h1>
            <p class="subtitle">Arapça Okunuşu ile Türkçe Telaffuzu</p>
        </header>

        <!-- Search Bar -->
        <div class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                class="search-box" 
                placeholder="Sure adı veya ayetin bir kısmını yazınız..."
                autocomplete="off"
            >
            <div id="searchResults" class="search-results hidden"></div>
        </div>

        <!-- Navigation -->
        <div class="nav-section">
            <button id="prevBtn" class="nav-btn">← Önceki Sure</button>
            <div class="page-info">
                <span id="currentSurah">Sure 1</span>
                <span class="separator">•</span>
                <span id="currentPage">Sayfa 1</span>
            </div>
            <button id="nextBtn" class="nav-btn">Sonraki Sure →</button>
        </div>

        <!-- Surah List Selector -->
        <div class="surah-selector">
            <select id="surahSelect" class="surah-dropdown">
                <option value="">Sure Seçiniz...</option>
            </select>
        </div>

        <!-- Main Content Area -->
        <main class="content-area">
            <div class="quran-page">
                <div id="contentDisplay" class="content-display">
                    <!-- Content will be loaded here -->
                </div>
            </div>
        </main>

        <!-- Pagination Controls -->
        <div class="pagination-section">
            <button id="firstBtn" class="pagination-btn">« İlk Sure</button>
            <button id="prevPageBtn" class="pagination-btn">‹ Önceki</button>
            <span id="pageCounter" class="page-counter">Sayfa 1 / 30</span>
            <button id="nextPageBtn" class="pagination-btn">Sonraki ›</button>
            <button id="lastBtn" class="pagination-btn">Son Sure »</button>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2024 Quran Web - Türkçe Telaffuz ile Kuran-ı Kerim</p>
        </footer>
    </div>

    <script src="quran-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
