<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kur'an-ı Kerim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            color: #e0e0e0;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        header {
            background: #16232a;
            border-bottom: 3px solid #d4af37;
            padding: 20px 30px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            color: #d4af37;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 14px;
            color: #999;
        }

        /* Controls */
        .controls {
            background: #1a2f38;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid #333;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            color: #d4af37;
            font-weight: 600;
            font-size: 14px;
        }

        select {
            padding: 10px 15px;
            background: white;
            border: 2px solid #d4af37;
            border-radius: 4px;
            color: #333;
            font-weight: 600;
            cursor: pointer;
            direction: rtl;
            text-align: right;
            min-width: 250px;
        }

        select:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* Page Counter */
        .page-counter {
            color: #d4af37;
            font-weight: 600;
            font-size: 16px;
            min-width: 120px;
            text-align: center;
        }

        /* Main Content */
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow: hidden;
        }

        /* Book Container */
        .book {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            height: 100%;
        }

        .page {
            flex: 1;
            background: #faf5f0;
            border-radius: 8px;
            padding: 40px 30px;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #e0d5c8;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #d4af37;
        }

        .page-header h2 {
            color: #d4af37;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .page-header .page-num {
            color: #999;
            font-size: 12px;
            font-weight: 600;
        }

        /* Ayah */
        .ayah {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid #e0d5c8;
        }

        .ayah:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .ayah-number {
            display: inline-block;
            background: #d4af37;
            color: #0f1419;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .ayah-arabic {
            font-family: 'Traditional Arabic', 'Arabic Typesetting', 'Arial Unicode MS', serif;
            font-size: 28px;
            line-height: 2.2;
            color: #1a1a1a;
            text-align: right;
            direction: rtl;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .ayah-turkish {
            font-size: 15px;
            line-height: 1.8;
            color: #555;
            text-align: left;
            direction: ltr;
            background: #f8f3ed;
            padding: 12px 15px;
            border-left: 3px solid #d4af37;
            border-radius: 3px;
        }

        /* Navigation */
        .navigation {
            background: #1a2f38;
            padding: 20px 30px;
            display: flex;
            justify-content: center;
            gap: 30px;
            border-top: 1px solid #333;
        }

        button {
            padding: 12px 28px;
            background: #d4af37;
            color: #0f1419;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            background: #e0b93a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 10px;
        }

        /* Scrollbar */
        .page::-webkit-scrollbar {
            width: 8px;
        }

        .page::-webkit-scrollbar-track {
            background: #f1ebe3;
        }

        .page::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }

        .page::-webkit-scrollbar-thumb:hover {
            background: #c9a227;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .book {
                flex-direction: column;
                gap: 30px;
            }

            .page {
                padding: 30px 20px;
            }

            .ayah-arabic {
                font-size: 24px;
            }

            .ayah-turkish {
                font-size: 14px;
            }
        }

        @media (max-width: 640px) {
            header h1 {
                font-size: 24px;
            }

            .controls {
                flex-direction: column;
                gap: 15px;
            }

            select {
                min-width: 100%;
            }

            .page {
                padding: 20px 15px;
            }

            .ayah-arabic {
                font-size: 20px;
            }

            .ayah-turkish {
                font-size: 13px;
            }

            .navigation {
                flex-direction: column;
                gap: 10px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>📖 Kur'an-ı Kerim</h1>
            <p>Arapça Metni & Türkçe Telaffuzu</p>
        </header>

        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <label for="surahSelect">Sûre Seç:</label>
                <select id="surahSelect" onchange="selectSurah()">
                    <option value="">-- Sûre Seçiniz --</option>
                </select>
            </div>
            <div class="page-counter" id="pageCounter">Sayfa: 1 / 1</div>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="book">
                <div class="page" id="leftPage">
                    <div class="empty-state">
                        <p>📖 Bir sûre seçiniz</p>
                    </div>
                </div>
                <div class="page" id="rightPage">
                    <div class="empty-state">
                        <p></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="navigation">
            <button onclick="previousPage()" id="prevBtn">← Önceki Sayfa</button>
            <button onclick="nextPage()" id="nextBtn">Sonraki Sayfa →</button>
        </div>
    </div>

    <script src="quran-data.js"></script>
    <script>
        let currentPage = 0;
        let currentSurah = null;
        let pages = [];

        // Sûreleri dropdown'a ekle
        function populateSurahSelect() {
            const select = document.getElementById('surahSelect');
            if (typeof quranData !== 'undefined' && quranData.length > 0) {
                quranData.forEach((surah) => {
                    const option = document.createElement('option');
                    option.value = surah.number;
                    option.textContent = `${surah.number}. ${surah.nameTr}`;
                    select.appendChild(option);
                });
            }
        }

        // Sûre seç
        function selectSurah() {
            const surahNum = parseInt(document.getElementById('surahSelect').value);
            if (surahNum) {
                loadSurah(surahNum);
            }
        }

        // Sûre yükle
        function loadSurah(surahNum) {
            if (typeof quranData === 'undefined') {
                console.error('quranData yüklenmedi');
                return;
            }

            currentSurah = quranData.find(s => s.number === surahNum);
            if (!currentSurah) {
                console.error(`Sure ${surahNum} bulunamadı`);
                return;
            }

            currentPage = 0;
            pages = [];

            // Her sayfa 6 ayet olsun
            const ayahsPerPage = 6;
            for (let i = 0; i < currentSurah.ayahs.length; i += ayahsPerPage) {
                pages.push(currentSurah.ayahs.slice(i, i + ayahsPerPage));
            }

            displayPage();
            updateButtons();
            document.getElementById('surahSelect').value = surahNum;
        }

        // Sayfayı göster
        function displayPage() {
            const leftPageEl = document.getElementById('leftPage');
            const rightPageEl = document.getElementById('rightPage');

            leftPageEl.innerHTML = '';
            rightPageEl.innerHTML = '';

            if (pages.length === 0) return;

            // Sol sayfa (şu anki sayfa)
            if (currentPage < pages.length) {
                let leftHTML = `
                    <div class="page-header">
                        <h2>${currentSurah.nameTr}</h2>
                        <div class="page-num">صفحة ${currentPage + 1}</div>
                    </div>
                `;

                pages[currentPage].forEach(ayah => {
                    leftHTML += `
                        <div class="ayah">
                            <div class="ayah-number">${ayah.number}</div>
                            <div class="ayah-arabic">${ayah.arabic}</div>
                            <div class="ayah-turkish">${ayah.transliteration}</div>
                        </div>
                    `;
                });

                leftPageEl.innerHTML = leftHTML;
            }

            // Sağ sayfa (sonraki sayfa)
            if (currentPage + 1 < pages.length) {
                let rightHTML = `
                    <div class="page-header">
                        <h2>${currentSurah.nameTr}</h2>
                        <div class="page-num">صفحة ${currentPage + 2}</div>
                    </div>
                `;

                pages[currentPage + 1].forEach(ayah => {
                    rightHTML += `
                        <div class="ayah">
                            <div class="ayah-number">${ayah.number}</div>
                            <div class="ayah-arabic">${ayah.arabic}</div>
                            <div class="ayah-turkish">${ayah.transliteration}</div>
                        </div>
                    `;
                });

                rightPageEl.innerHTML = rightHTML;
            }

            // Sayfa sayacı
            document.getElementById('pageCounter').textContent = `Sayfa: ${currentPage + 1} / ${Math.ceil(pages.length)}`;
        }

        // Sonraki sayfa
        function nextPage() {
            if (currentPage + 1 < pages.length) {
                currentPage++;
                displayPage();
                updateButtons();
            }
        }

        // Önceki sayfa
        function previousPage() {
            if (currentPage > 0) {
                currentPage--;
                displayPage();
                updateButtons();
            }
        }

        // Butonları güncelle
        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage + 1 >= pages.length;
        }

        // Başlat
        populateSurahSelect();
    </script>
</body>
</html>
