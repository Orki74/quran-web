<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuran Kerim - kurankerim.com</title>
<style>
  :root{
    --bg:#0d1417;
    --bg-2:#0a0f12;
    --panel:#16232a;
    --panel-2:#1d2f38;
    --gold:#c9a227;
    --gold-light:#e0b93a;
    --text:#e8dfc2;
    --text-dim:#9fb0ac;
    --arabic-bg:#fdf6e3;
    --shadow:rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(ellipse at top, #1b2a2f, var(--bg-2));
    color:var(--text);
    font-family:'Segoe UI', Tahoma, sans-serif;
  }

  /* ================= ÜST BAR ================= */
  header.site{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 24px;
    background:var(--panel);
    border-bottom:2px solid var(--gold);
    flex-wrap:wrap;
    gap:10px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .logo{
    width:36px;height:36px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--gold-light), var(--gold) 70%);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    color:#12191c;
    font-weight:700;
  }
  .brand h1{
    margin:0;
    font-size:19px;
    color:var(--gold-light);
    letter-spacing:.3px;
  }
  .brand span{
    display:block;
    font-size:11px;
    color:var(--text-dim);
    font-weight:400;
  }
  nav.tabs{
    display:flex;
    gap:8px;
  }
  nav.tabs button{
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold-light);
    padding:8px 18px;
    border-radius:20px;
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;
    transition:background .15s, color .15s;
  }
  nav.tabs button.active,
  nav.tabs button:hover{
    background:var(--gold);
    color:#12191c;
  }

  /* ================= GENEL VIEW YÖNETİMİ ================= */
  .view{ display:none; }
  .view.active{ display:block; }

  /* ================= MUSHAF (SAYFA ÇEVİRME) GÖRÜNÜMÜ ================= */
  #view-mushaf{
    height:calc(100vh - 68px);
  }
  .app{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    perspective:2400px;
    user-select:none;
  }
  .book{
    position:relative;
    width:min(90vw, 1000px);
    height:min(70vh, 600px);
    transform-style:preserve-3d;
    display:flex;
    gap:2px;
    background:#2a2a2a;
    border-radius:8px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    overflow:hidden;
  }
  .page{
    flex:1;
    position:relative;
    background:var(--arabic-bg);
    overflow-y:auto;
    padding:30px;
    display:flex;
    flex-direction:column;
    transform-style:preserve-3d;
    backface-visibility:hidden;
    border:1px solid #ddd;
  }
  .page.left{
    transform:rotateY(5deg);
    box-shadow:inset 3px 0 8px rgba(0,0,0,0.1);
  }
  .page.right{
    transform:rotateY(-5deg);
    box-shadow:inset -3px 0 8px rgba(0,0,0,0.1);
    direction:rtl;
    text-align:right;
  }
  .page-number{
    text-align:center;
    color:var(--gold);
    font-weight:600;
    font-size:0.9em;
    margin-bottom:15px;
  }
  .surah-title{
    text-align:center;
    color:var(--gold);
    font-size:1.6em;
    font-weight:bold;
    margin:15px 0;
    padding:10px;
    border-bottom:2px solid var(--gold);
  }
  .ayah-block{
    margin:15px 0;
    padding:12px;
    background:#fffbf5;
    border-right:4px solid var(--gold);
    border-radius:4px;
    transition:all 0.3s ease;
  }
  .ayah-block:hover{
    background:#f5f1e8;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
  }
  .ayah-arabic{
    font-family:'Arabic Typesetting', 'Arial Unicode MS', 'Tahoma', sans-serif;
    font-size:1.8em;
    line-height:2.2;
    color:#1a1a1a;
    margin:10px 0;
    font-weight:600;
    direction:rtl;
    text-align:right;
  }
  .ayah-transliteration{
    background:#f0e8d8;
    padding:10px;
    border-radius:4px;
    font-size:0.85em;
    color:#555;
    margin-top:8px;
    line-height:1.5;
    border-left:3px solid var(--gold);
    direction:ltr;
    text-align:left;
  }
  .ayah-number{
    display:inline-block;
    background:var(--gold);
    color:#12191c;
    padding:2px 8px;
    border-radius:4px;
    font-size:0.8em;
    font-weight:600;
    margin-right:8px;
  }
  .play-btn{
    padding:6px 12px;
    background:var(--gold);
    color:#12191c;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-size:0.9em;
    margin-top:8px;
    transition:all 0.3s ease;
    font-weight:600;
  }
  .play-btn:hover{
    background:var(--gold-light);
  }
  .nav-buttons{
    display:flex;
    gap:15px;
    justify-content:center;
    margin-top:15px;
  }
  .nav-btn{
    padding:12px 25px;
    background:var(--gold);
    color:#12191c;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
    font-size:1em;
    transition:all 0.3s ease;
  }
  .nav-btn:hover:not(:disabled){
    background:var(--gold-light);
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(139, 69, 19, 0.3);
  }
  .nav-btn:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }
  .page-info{
    text-align:center;
    color:var(--text);
    font-size:1.1em;
    font-weight:600;
    margin-bottom:10px;
  }
  .controls{
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .control-group{
    display:flex;
    gap:10px;
    align-items:center;
  }
  select{
    padding:10px 15px;
    border:2px solid var(--gold);
    border-radius:6px;
    background:white;
    color:#1a1a1a;
    cursor:pointer;
    font-weight:600;
    direction:rtl;
    text-align:right;
  }

  /* ================= SURE OKU & DİNLE GÖRÜNÜMÜ ================= */
  #view-sureler{
    display:flex;
    height:calc(100vh - 68px);
  }
  .sidebar{
    width:280px;
    min-width:220px;
    background:var(--panel);
    overflow-y:auto;
    border-right:1px solid #24343c;
  }
  .sidebar-title{
    font-size:15px;
    padding:14px 16px;
    margin:0;
    color:var(--gold-light);
    border-bottom:1px solid #24343c;
  }
  .surah-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    cursor:pointer;
    border-bottom:1px solid #1a262c;
    transition:background .15s;
  }
  .surah-item:hover{ background:var(--panel-2); }
  .surah-item.active{ background:#26404a; }
  .surah-num{
    width:26px;height:26px;
    border:1px solid var(--gold);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
    color:var(--gold-light);
    flex-shrink:0;
  }
  .surah-names{ display:flex; flex-direction:column; }
  .surah-name-tr{ font-size:14px; color:var(--text); }
  .surah-name-ar{ font-size:12px; color:var(--text-dim); }

  .content{
    flex:1;
    overflow-y:auto;
    padding:24px 32px 60px;
  }
  .surah-header{
    text-align:center;
    padding-bottom:18px;
    margin-bottom:24px;
    border-bottom:2px solid var(--gold);
  }
  .surah-header h2{
    margin:0 0 4px;
    color:var(--gold-light);
    font-size:26px;
  }
  .surah-header .meta{
    color:var(--text-dim);
    font-size:13px;
  }
  .toolbar{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .toolbar button{
    background:var(--gold);
    color:#12191c;
    border:none;
    padding:9px 18px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .toolbar button:hover{ background:var(--gold-light); }
  .toolbar button:active{ transform:scale(.96); }
  .toolbar button.secondary{

    color:var(--gold-light);
    border:1px solid var(--gold);
  }

    background:var(--panel);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:14px;
    border:1px solid #22323a;

    border-color:var(--gold);
    box-shadow:0 0 0 1px var(--gold) inset;
  }

    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .ayah-no{
    background:var(--gold);

    font-size:11px;
    font-weight:700;
    padding:2px 9px;
    border-radius:12px;
  }
  .play-single{
    background:none;
    border:1px solid var(--gold);
    color:var(--gold-light);
    width:30px;height:30px;
    border-radius:50%;
    cursor:pointer;
    font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  .play-single:hover{ background:#26404a; }
  .arabic{
    background:var(--arabic-bg);
    color:#1a1a1a;
    direction:rtl;
    font-size:26px;
    line-height:2.2;

    border-radius:8px;
    margin-bottom:10px;

  }

    color:var(--text);
    font-size:14.5px;
    line-height:1.6;
  }
  .label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--text-dim);
    margin-bottom:3px;
  }

    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
  }
  .error{ color:#e08a8a; }
  .error a{ color:var(--gold-light); }

  footer.site{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    padding:10px;
    background:var(--panel);

  ::-webkit-scrollbar-thumb{ background:#2a3d45; border-radius:4px; }

  @media (max-width:720px){

    .sidebar{ width:100%; max-height:220px; }
    .book{ width:70vw; height:60vh; }
  }
</style>
</head>

   SEKME (TAB) GEÇİŞİ
====================================================================== */
const tabMushaf   = document.getElementById('tabMushaf');
const tabSureler  = document.getElementById('tabSureler');
const viewMushaf  = document.getElementById('view-mushaf');
const viewSureler = document.getElementById('view-sureler');

tabMushaf.addEventListener('click', () => {
  tabMushaf.classList.add('active');
  tabSureler.classList.remove('active');
  viewMushaf.classList.add('active');
  viewSureler.classList.remove('active');
});
tabSureler.addEventListener('click', () => {
  tabSureler.classList.add('active');
  tabMushaf.classList.remove('active');
  viewSureler.classList.add('active');
  viewMushaf.classList.remove('active');

/* ======================================================================
   1) MUSHAF SAYFA ÇEVİRME MOTORU (LOKAL VERİ İLE)
====================================================================== */
let currentPage = 0;
let currentSurah = 1;
let pages = [];

function initMushaf() {
  populateSurahSelect();
  loadSurah(1);
}

function populateSurahSelect() {
  const select = document.getElementById('surahSelect');
  if (typeof quranData !== 'undefined' && quranData.length > 0) {
    quranData.forEach((surah) => {
      const option = document.createElement('option');
      option.value = surah.number;
      option.textContent = `${surah.number}. ${surah.nameTr}`;
      select.appendChild(option);
    });
  }
}

function selectSurah() {
  const surahNum = parseInt(document.getElementById('surahSelect').value);
  if (surahNum) {
    loadSurah(surahNum);
  }
}

function loadSurah(surahNum) {
  if (typeof quranData === 'undefined') {
    console.error('quranData yüklenmedi');
    return;
  }

  currentSurah = surahNum;
  currentPage = 0;
  const surah = quranData.find(s => s.number === surahNum);
  
  if (!surah) {
    console.error(`Sure ${surahNum} bulunamadı`);
    return;
  }

  pages = [];
  const ayahsPerPage = 8;
  
  for (let i = 0; i < surah.ayahs.length; i += ayahsPerPage) {
    pages.push(surah.ayahs.slice(i, i + ayahsPerPage));
  }

  displayPage();
  updateButtons();
  document.getElementById('surahSelect').value = surahNum;
}

function displayPage() {
  const leftPageEl = document.getElementById('leftPage');
  const rightPageEl = document.getElementById('rightPage');
  
  leftPageEl.innerHTML = '';
  rightPageEl.innerHTML = '';

  if (pages.length === 0) return;

  const surah = quranData.find(s => s.number === currentSurah);

  if (currentPage < pages.length) {
    leftPageEl.innerHTML = `<div class="page-number">صفحة ${currentPage + 1}</div>`;
    if (currentPage === 0) {
      leftPageEl.innerHTML += `<div class="surah-title">${surah.nameTr}</div>`;
    }
    pages[currentPage].forEach(ayah => {
      leftPageEl.innerHTML += createAyahHTML(ayah, surah);
    });
  }

  if (currentPage + 1 < pages.length) {
    rightPageEl.innerHTML = `<div class="page-number">صفحة ${currentPage + 2}</div>`;
    pages[currentPage + 1].forEach(ayah => {
      rightPageEl.innerHTML += createAyahHTML(ayah, surah);
    });
  }

  document.getElementById('pageCounter').textContent = `Sayfa: ${currentPage + 1} / ${Math.ceil(pages.length / 1)}`;
}

function createAyahHTML(ayah, surah) {
  return `
    <div class="ayah-block">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="ayah-number">${ayah.number}</span>
      </div>
      <div class="ayah-arabic">${ayah.arabic}</div>
      <div class="ayah-transliteration"><strong>Telaffuz:</strong> ${ayah.transliteration}</div>
      <button class="play-btn" onclick="playAyahAudio('${surah.number}', '${ayah.number}')">🔊 Dinle</button>
    </div>
  `;
}

function playAyahAudio(surahNum, ayahNum) {
  alert(`Surah ${surahNum}, Ayet ${ayahNum} dinlenecek (sesli verisi eklenecek)`);
}

function nextPage() {
  if (currentPage + 1 < pages.length) {
    currentPage++;
    displayPage();
    updateButtons();
  }
}

function previousPage() {
  if (currentPage > 0) {
    currentPage--;
    displayPage();
    updateButtons();
  }
}

function updateButtons() {
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage + 1 >= pages.length;
}

// Başlat
initMushaf();

const surahListEl = document.getElementById('surahList');
const contentEl   = document.getElementById('content');
const audioPlayer = document.getElementById('audioPlayer');

let currentSurahAyahs = [];
let currentIndex      = -1;
let playAllActive     = false;

SURAHS.forEach(s => {
  const item = document.createElement('div');
  item.className = 'surah-item';
  item.dataset.n = s.n;
  item.innerHTML = `
    <div class="surah-num">${s.n}</div>
    <div class="surah-names">
      <div class="surah-name-tr">${s.name}</div>
      <div class="surah-name-ar">${s.arabic} · ${s.ayahs} ayet</div>
    </div>`;
  item.addEventListener('click', () => loadSurahFromAPI(s.n));
  surahListEl.appendChild(item);
});

async function loadSurahFromAPI(number){
  document.querySelectorAll('.surah-item').forEach(el =>
    el.classList.toggle('active', Number(el.dataset.n) === number));

  contentEl.innerHTML = '<div class="loading">Yükleniyor...</div>';
  stopAudio();

  try{
    let arabicData, mealData, audioData;

    try{
      const editions = `${ARABIC_EDITION},${TR_MEAL_EDITION},${RECITER_EDITION}`;
      const res = await fetch(`${API_BASE}/surah/${number}/editions/${editions}`);
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if(json.code !== 200 || !Array.isArray(json.data) || json.data.length < 3){
        throw new Error('Beklenmeyen API yanıtı');
      }
      [arabicData, mealData, audioData] = json.data;
    }catch(combinedErr){
      console.warn('Birleşik istek başarısız, ayrı ayrı deneniyor:', combinedErr);
      const fetchOne = async (edition) => {
        const r = await fetch(`${API_BASE}/surah/${number}/${edition}`);
        if(!r.ok) throw new Error(`${edition} için HTTP ${r.status}`);
        const j = await r.json();
        if(j.code !== 200) throw new Error(`${edition} için API hatası`);
        return j.data;
      };
      [arabicData, mealData, audioData] = await Promise.all([
        fetchOne(ARABIC_EDITION),
        fetchOne(TR_MEAL_EDITION),
        fetchOne(RECITER_EDITION)
      ]);
    }

    const surahInfo = SURAHS.find(s => s.n === number);

    currentSurahAyahs = arabicData.ayahs.map((a, i) => ({
      number: a.numberInSurah,
      arabic: a.text,
      meal: mealData.ayahs[i] ? mealData.ayahs[i].text : '',
      audio: audioData.ayahs[i] ? audioData.ayahs[i].audio : ''
    }));

    renderSurah(surahInfo, arabicData);
  }catch(err){
    console.error('Sure yüklenirken hata:', err);
    contentEl.innerHTML = `
      <div class="error">
        Sure yüklenemedi.<br><br>
        <small>Teknik hata: ${err.message || err}</small>
      </div>`;
  }
}

function renderSurah(surahInfo, arabicData){
  contentEl.innerHTML = `
    <div class="surah-header">
      <h2>${surahInfo.n}. ${surahInfo.name} Sûresi <span style="direction:rtl">(${surahInfo.arabic})</span></h2>
      <div class="meta">${arabicData.revelationType === 'Meccan' ? 'Mekkî' : 'Medenî'} · ${surahInfo.ayahs} ayet</div>
    </div>
    <div class="toolbar">
      <button id="playAllBtn">▶ Tüm sureyi dinle (Abdülbasıt Abdüssamed)</button>
      <button id="stopBtn" class="secondary">■ Durdur</button>
    </div>
    <div id="ayahList"></div>
  `;

  const list = document.getElementById('ayahList');
  currentSurahAyahs.forEach((a, idx) => {
    const div = document.createElement('div');
    div.className = 'ayah';
    div.id = `ayah-${idx}`;
    div.innerHTML = `
      <div class="ayah-top">
        <span class="ayah-no">${a.number}</span>
        <button class="play-single" data-idx="${idx}">▶</button>
      </div>
      <div class="arabic">${a.arabic}</div>
      <div class="label">Meal (Diyanet)</div>
      <div class="meal">${a.meal}</div>
    `;
    list.appendChild(div);
  });

  document.querySelectorAll('.play-single').forEach(btn => {
    btn.addEventListener('click', () => {
      playAllActive = false;
      playAyah(Number(btn.dataset.idx));
    });
  });

  document.getElementById('playAllBtn').addEventListener('click', () => {
    playAllActive = true;
    playAyah(0);
  });
  document.getElementById('stopBtn').addEventListener('click', stopAudio);
}

function playAyah(idx){
  if(idx < 0 || idx >= currentSurahAyahs.length){ stopAudio(); return; }
  currentIndex = idx;

  document.querySelectorAll('.ayah').forEach(el => el.classList.remove('playing'));
  const el = document.getElementById(`ayah-${idx}`);
  if(el){
    el.classList.add('playing');
    el.scrollIntoView({behavior:'smooth', block:'center'});
  }

  audioPlayer.src = currentSurahAyahs[idx].audio;
  audioPlayer.play();
}

audioPlayer.addEventListener('ended', () => {
  if(playAllActive) playAyah(currentIndex + 1);
});

function stopAudio(){
  playAllActive = false;
  audioPlayer.pause();
  audioPlayer.currentTime = 0;
  document.querySelectorAll('.ayah').forEach(el => el.classList.remove('playing'));
}
</script>
