<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kur'an-ı Kerim - Sayfa Çevirme</title>
    <style>
        :root {
            --bg-top: #1b2a2f;
            --bg-bottom: #0d1417;
            --page-bg: #fdf6e3;
            --shadow: rgba(0, 0, 0, .5);
            --text-color: #1a1a1a;
            --accent: #8b4513;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: radial-gradient(ellipse at top, var(--bg-top), var(--bg-bottom));
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
        }

        .app {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            perspective: 2400px;
            user-select: none;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: #f5f1e8;
            margin-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, button {
            padding: 10px 15px;
            border: 2px solid var(--accent);
            border-radius: 6px;
            background: white;
            color: var(--text-color);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        select {
            direction: rtl;
            text-align: right;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
        }

        button:hover {
            background: #5c2e0f;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.3);
        }

        .book-container {
            position: relative;
            width: min(90vw, 1000px);
            height: min(70vh, 600px);
            perspective: 2400px;
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            display: flex;
            gap: 2px;
            background: #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .page {
            flex: 1;
            position: relative;
            background: var(--page-bg);
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            border: 1px solid #ddd;
        }

        .page.left {
            transform: rotateY(5deg);
            box-shadow: inset 3px 0 8px rgba(0, 0, 0, 0.1);
        }

        .page.right {
            transform: rotateY(-5deg);
            box-shadow: inset -3px 0 8px rgba(0, 0, 0, 0.1);
            direction: rtl;
            text-align: right;
        }

        .page-number {
            text-align: center;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .surah-title {
            text-align: center;
            color: var(--accent);
            font-size: 1.6em;
            font-weight: bold;
            margin: 15px 0;
            padding: 10px;
            border-bottom: 2px solid var(--accent);
        }

        .ayah-block {
            margin: 15px 0;
            padding: 12px;
            background: #fffbf5;
            border-right: 4px solid var(--accent);
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .ayah-block:hover {
            background: #f5f1e8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .ayah-arabic {
            font-family: 'Arabic Typesetting', 'Arial Unicode MS', 'Tahoma', sans-serif;
            font-size: 1.8em;
            line-height: 2.2;
            color: #1a1a1a;
            margin: 10px 0;
            font-weight: 600;
            direction: rtl;
            text-align: right;
        }

        .ayah-transliteration {
            background: #f0e8d8;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #555;
            margin-top: 8px;
            line-height: 1.5;
            border-left: 3px solid var(--accent);
            direction: ltr;
            text-align: left;
        }

        .ayah-number {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
            margin-left: 8px;
        }

        .play-btn {
            padding: 6px 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 8px;
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            background: #5c2e0f;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        .nav-btn {
            padding: 12px 25px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background: #5c2e0f;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.3);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            text-align: center;
            color: #f5f1e8;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .audio-player {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #f0e8d8;
            border-radius: 6px;
        }

        @media (max-width: 768px) {
            .book {
                flex-direction: column;
            }

            .page {
                padding: 20px;
                font-size: 0.9em;
            }

            .ayah-arabic {
                font-size: 1.4em;
            }

            .header h1 {
                font-size: 1.5em;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1e8d8;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5c2e0f;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>📖 Kur'an-ı Kerim</h1>
    </div>

    <div class="controls">
        <div class="control-group">
            <select id="surahSelect" onchange="selectSurah()">
                <option value="">Sûre Seç...</option>
            </select>
        </div>
    </div>

    <div class="page-info">
        <span id="pageCounter">Sayfa: 1 / 1</span>
    </div>

    <div class="book-container">
        <div class="book">
            <div class="page left" id="leftPage"></div>
            <div class="page right" id="rightPage"></div>
        </div>
    </div>

    <div class="nav-buttons">
        <button class="nav-btn" onclick="previousPage()" id="prevBtn">← Önceki Sayfa</button>
        <button class="nav-btn" onclick="nextPage()" id="nextBtn">Sonraki Sayfa →</button>
    </div>

    <audio id="audioPlayer" style="width: 100%; max-width: 800px;"></audio>
</div>

<script src="quran-data.js"></script>
<script>
    let currentPage = 0;
    let currentSurah = 1;
    let pages = [];

    // Initialize
    function init() {
        populateSurahSelect();
        loadSurah(1);
    }

    function populateSurahSelect() {
        const select = document.getElementById('surahSelect');
        quranData.forEach((surah, index) => {
            const option = document.createElement('option');
            option.value = surah.number;
            option.textContent = `${surah.number}. ${surah.name}`;
            select.appendChild(option);
        });
    }

    function selectSurah() {
        const surahNum = parseInt(document.getElementById('surahSelect').value);
        if (surahNum) {
            loadSurah(surahNum);
        }
    }

    function loadSurah(surahNum) {
        currentSurah = surahNum;
        currentPage = 0;
        const surah = quranData.find(s => s.number === surahNum);
        
        // Divide ayahs into pages (2 pages at a time - left and right)
        pages = [];
        const ayahsPerPage = 8; // Adjust based on ayah length
        
        for (let i = 0; i < surah.ayahs.length; i += ayahsPerPage) {
            pages.push(surah.ayahs.slice(i, i + ayahsPerPage));
        }

        displayPage();
        updateButtons();
        document.getElementById('surahSelect').value = surahNum;
    }

    function displayPage() {
        const leftPageEl = document.getElementById('leftPage');
        const rightPageEl = document.getElementById('rightPage');
        
        leftPageEl.innerHTML = '';
        rightPageEl.innerHTML = '';

        const surah = quranData.find(s => s.number === currentSurah);

        // Left page - current page
        if (currentPage < pages.length) {
            leftPageEl.innerHTML = `<div class="page-number">صفحة ${currentPage + 1}</div>`;
            if (currentPage === 0) {
                leftPageEl.innerHTML += `<div class="surah-title">${surah.name}</div>`;
            }
            pages[currentPage].forEach(ayah => {
                leftPageEl.innerHTML += createAyahHTML(ayah, surah);
            });
        }

        // Right page - next page
        if (currentPage + 1 < pages.length) {
            rightPageEl.innerHTML = `<div class="page-number">صفحة ${currentPage + 2}</div>`;
            pages[currentPage + 1].forEach(ayah => {
                rightPageEl.innerHTML += createAyahHTML(ayah, surah);
            });
        }

        document.getElementById('pageCounter').textContent = `Sayfa: ${currentPage + 1} / ${pages.length}`;
    }

    function createAyahHTML(ayah, surah) {
        return `
            <div class="ayah-block">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="ayah-number">${ayah.number}</span>
                </div>
                <div class="ayah-arabic">${ayah.arabic}</div>
                <div class="ayah-transliteration">${ayah.transliteration}</div>
                <button class="play-btn" onclick="playAyah('${surah.number}', '${ayah.number}')">🔊 Dinle</button>
            </div>
        `;
    }

    function playAyah(surahNum, ayahNum) {
        // This would need YouTube video URLs or audio files
        console.log(`Playing Surah ${surahNum}, Ayah ${ayahNum}`);
        alert(`Surah ${surahNum}, Ayah ${ayahNum} seslendirilecek`);
    }

    function nextPage() {
        if (currentPage + 1 < pages.length) {
            currentPage++;
            displayPage();
            updateButtons();
        }
    }

    function previousPage() {
        if (currentPage > 0) {
            currentPage--;
            displayPage();
            updateButtons();
        }
    }

    function updateButtons() {
        document.getElementById('prevBtn').disabled = currentPage === 0;
        document.getElementById('nextBtn').disabled = currentPage + 1 >= pages.length;
    }

    // Start
    init();
</script>
</body>
</html>
